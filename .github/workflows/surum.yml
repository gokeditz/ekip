# Yeni sürüm: "v1.0.1" gibi bir etiket gönderince (git tag v1.0.1 && git push origin v1.0.1)
#  1) Uygulama Windows için tek exe olarak derlenir. (Sunucu Cloudflare'da: Ekip.Bulut, "npx wrangler deploy".)
#  2) GitHub'da bir "Release" oluşturulur. İçinde:
#       Ekip-Windows.zip          -> ilk kurulum (arkadaşlara bu link verilir)
#       Ekip-<sürüm>.zip + son.json -> otomatik güncelleme; açık olan tüm Ekip'ler 30 dakika içinde
#                                    (ya da bir sonraki açılışta) yeni sürümü görüp güncellemeyi sorar
name: Sürüm

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Sürüm numarası
        id: surum
        shell: pwsh
        run: |
          $no = "${{ github.ref_name }}".TrimStart("v")
          "no=$no" >> $env:GITHUB_OUTPUT
          # Güncelleme notu: etiketlenen commit'in başlığı.
          $not = (git log -1 --format=%s).Trim()
          "not=$not" >> $env:GITHUB_OUTPUT

      - name: Uygulama (Windows, tek exe, .NET kurulumu gerekmez)
        shell: pwsh
        env:
          GUNCELLEME_NOTU: ${{ steps.surum.outputs.not }} # Betiğe ortam değişkeniyle: tırnak vb. karakterler komutu bozmasın.
        run: |
          ./dagitim/guncelleme-paketle.ps1 -Surum "${{ steps.surum.outputs.no }}" -Notlar $env:GUNCELLEME_NOTU -Cikti yayin/guncelleme `
            -IndirmeTabani "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          Copy-Item "yayin/guncelleme/Ekip-${{ steps.surum.outputs.no }}.zip" Ekip-Windows.zip

      - name: Release oluştur
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "Ekip ${{ github.ref_name }}" --generate-notes `
            Ekip-Windows.zip "yayin/guncelleme/Ekip-${{ steps.surum.outputs.no }}.zip" yayin/guncelleme/son.json
